version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    groups:
      c2pa-python:
        patterns:
          - "c2pa-python"
      python-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "c2pa-python"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    groups:
      github-actions:
        patterns:
          - "*"