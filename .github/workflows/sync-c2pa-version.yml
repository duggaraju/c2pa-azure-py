name: Sync c2pa-python version

on:
  pull_request_target:
    types: [opened, reopened, synchronize]
    paths:
      - requirements.txt

permissions:
  contents: write

jobs:
  sync:
    name: Synchronize package version
    if: >-
      github.actor == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      # Copy the synchronizer from the trusted base branch. No code from the
      # pull request is executed by this pull_request_target workflow.
      - name: Check out trusted synchronizer
        uses: actions/checkout@v7

      - name: Preserve trusted synchronizer
        run: cp scripts/sync_c2pa_version.py "$RUNNER_TEMP/sync_c2pa_version.py"

      - name: Check out Dependabot branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Synchronize versions
        env:
          C2PA_SYNC_ROOT: ${{ github.workspace }}
        run: python "$RUNNER_TEMP/sync_c2pa_version.py"

      - name: Commit synchronized versions
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml src/c2pa_azure/__init__.py
          git commit -m "Sync package version with c2pa-python"
          git push origin "HEAD:${HEAD_REF}"